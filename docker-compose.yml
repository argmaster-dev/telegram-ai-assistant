services:
  tg_qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: tg_assist_tg_qdrant
    restart: unless-stopped
    networks:
      - tg_assist_internal
    ports:
      - "16333:6333"
    volumes:
      - tg_qdrant_data:/qdrant/storage

  tg_ollama:
    image: ollama/ollama:latest
    container_name: tg_assist_tg_ollama
    restart: unless-stopped
    networks:
      - tg_assist_internal
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - tg_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tg_assist_bot:
    build: .
    container_name: tg_assist_tg_assist_bot
    restart: unless-stopped
    networks:
      - tg_assist_internal
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      tg_qdrant:
        condition: service_started
      tg_ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import bot' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tg_assist_internal:
    driver: bridge

volumes:
  tg_qdrant_data:
  tg_ollama_data:
